name: Manylinux Wheel Smoke Test

on:
  pull_request:
    paths:
      - '.github/workflows/wheel-smoke.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'CMakeLists.txt'
      - 'cpp/**'
      - 'bindings/**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-smoke:
    name: Build manylinux wheel and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install "cibuildwheel>=3.2,<4"

      - name: Build manylinux wheel
        run: cibuildwheel --only cp312-manylinux_x86_64 --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: ""

      - name: Run wheel smoke test
        run: python tests/smoke_wheel_install.py --wheelhouse wheelhouse

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manylinux-wheel
          path: wheelhouse/*.whl
          retention-days: 7
