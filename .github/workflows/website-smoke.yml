name: Website Smoke

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/check_website.py"
      - ".github/workflows/website-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/check_website.py"
      - ".github/workflows/website-smoke.yml"

jobs:
  website-smoke:
    name: Static website smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Check local links, fragments, and required assets
        run: python scripts/check_website.py
